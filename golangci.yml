version: "2"

run:
  # timeout for analysis, e.g. 30s, 5m, default is none
  timeout: 5m

  # do not include test
  tests: false

  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused

  # all available settings of specific linters
  settings:
    depguard:
      rules:
        # kit/errors is transport free, the gRPC conversion of the coded errors lives in kit/grpc.
        errors-transport-free:
          files:
            - "**/kit/errors/*.go"
          deny:
            - pkg: "google.golang.org/grpc"
              desc: "kit/errors is transport free, use kit/grpc for the gRPC conversion"
            - pkg: "github.com/anthonycorbacho/workspace/api"
              desc: "kit/errors is transport free, use kit/grpc for the wire format"
        # the root package of a service holds the domain, it must not depend on a transport.
        # Add the root package of new services here.
        service-root-transport-free:
          files:
            - "**/sample/sampleapp/*.go"
          deny:
            - pkg: "google.golang.org/grpc"
              desc: "the root package is transport free, return coded errors (kit/errors)"
            - pkg: "github.com/grpc-ecosystem"
              desc: "the root package is transport free"
            - pkg: "github.com/anthonycorbacho/workspace/api"
              desc: "the root package is transport free, the API types belong to the handlers"
    errcheck:
      # report about not checking of errors in type assetions: `a := b.(MyStruct)`;
      # default is false: such cases aren't reported by default.
      check-type-assertions: false

      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      # default is false: such cases aren't reported by default.
      check-blank: true
    revive:
      confidence: 0.8
    gocyclo:
      min-complexity: 16
    dupl:
      # tokens count to trigger issue, 150 by default
      threshold: 150
    goconst:
      # minimal length of string constant, 3 by default
      min-len: 3
      # minimal occurrences count to trigger, 3 by default
      min-occurrences: 3
    lll:
      line-length: 200
      tab-width: 1

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
