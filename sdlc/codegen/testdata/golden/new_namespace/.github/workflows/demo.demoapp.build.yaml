name: demo/demoapp Build and Push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo/demoapp/**"
      - "kit/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".ko.yaml"
      - ".github/workflows/demo.demoapp.build.yaml"
      - ".github/workflows/ko-builder.yaml"

permissions:
  contents: read

jobs:
  # Build the image of the service and push it
  build-and-push:
    # local reusable workflow, so the builder is the one of the same commit.
    uses: ./.github/workflows/ko-builder.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      service: demoapp
      namespace: demo
