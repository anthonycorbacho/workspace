# Test catalog: internal vars, escaping and every var type.
docs:
  product: Acme
  support_email: help@acme.test

errors:
  - name: Quota
    code: ERR_00001
    kind: RESOURCE_EXHAUSTED
    common: true
    message: 'quota of {used}% reached for "{account}"'
    vars:
      - name: used
        type: float64
      - name: account
        type: string
      - name: accountID
        type: int64
        internal: true

  - name: NoPlaceholder
    code: ERR_00002
    kind: CANCELLED
    message: "100% \"done\" \\ not yet"
    vars:
      - name: retry
        type: bool

  - name: AllTypes
    code: ERR_00003
    kind: FAILED_PRECONDITION
    message: "{s} {b} {i} {i32} {i64} {u} {u32} {u64} {f32} {f64}"
    vars:
      - {name: s, type: string}
      - {name: b, type: bool}
      - {name: i, type: int}
      - {name: i32, type: int32}
      - {name: i64, type: int64}
      - {name: u, type: uint}
      - {name: u32, type: uint32}
      - {name: u64, type: uint64}
      - {name: f32, type: float32}
      - {name: f64, type: float64}

  - name: InternalOnly
    code: ERR_00004
    kind: DATA_LOSS
    message: "data loss | <stored> *chunk*"
    vars:
      - name: httpURLPath
        type: string
        internal: true
