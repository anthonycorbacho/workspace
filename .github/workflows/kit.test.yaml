name: Kit framework test
on:
  push:
    branches: [main]
    paths:
      - "kit/**"
      - "sdlc/errgen/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/kit.test.yaml"
  pull_request:
    paths:
      - "kit/**"
      - "sdlc/errgen/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/kit.test.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTINGDB_URL: postgresql://postgres:secret@localhost:5432/postgres
  TESTINGREDIS_URL: ":6379"
  TESTINGNATS_URL: "nats://127.0.0.1:4222"
  PUBSUB_EMULATOR_HOST: ":8085"
  TESTINGKAFKA_URL: "127.0.0.1:19092"
  TESTINGMQTT_URL: "mqtt://127.0.0.1:1883"
  MINIO_TEST_URL: "localhost:9000"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Start up docker compose
        run: docker compose -f kit/docker-compose.yaml up -d --wait --remove-orphans
      - name: Run Kit Test
        run: go test -race -p=6 -cpu=1,4 ./kit/... ./sdlc/errgen/...
      - name: Dump containers logs
        if: failure()
        run: docker compose -f kit/docker-compose.yaml logs --tail=200
      - name: Stop containers
        if: always()
        run: docker compose -f kit/docker-compose.yaml down
