name: Lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Check go.mod and vendor are up to date
        run: |
          go mod tidy -diff
          go mod vendor
          git diff --exit-code -- vendor
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: -c golangci.yml

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        working-directory: api
        run: buf lint
      - name: Check generated code is up to date
        run: |
          make proto-gen
          git diff --exit-code -- api kit/pagination
