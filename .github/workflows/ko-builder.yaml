name: Ko Builder

on:
  workflow_call:
    inputs:
      service:
        required: true
        description: "Service to build"
        type: "string"
      namespace:
        required: true
        description: "Namespace of the service"
        type: "string"

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: Build the image
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ inputs.namespace }}/${{ inputs.service }}
          KO_USER: ${{ github.actor }}
          KO_PASSWORD: ${{ github.token }}
          GIT_REF: ${{ github.ref }}
          BINARY: ${{ inputs.service }}
        run: |
          SBOM=cyclonedx
          # the commit sha tag is immutable, it allows to deploy or rollback to a given commit.
          ko build --bare --sbom=$SBOM --tags=latest,${{ github.sha }} --image-refs=ko.images ./${{ inputs.namespace }}/${{ inputs.service }}/cmd/${{ inputs.service }}
