name: Sample/Sampleapp Unit test
on:
  pull_request:
    types: [ opened, synchronize ]
    paths:
      - "sample/sampleapp/**/*.go"
      - "kit/**/*.go"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run Test
        run: go test -v -race -p=6 -cpu=1,4 ./sample/sampleapp/...
